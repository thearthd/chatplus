        const HTML_URL =
            "https://raw.githubusercontent.com/" +
            "gn-math/html/main";


        const COVERS_URL =
            "https://raw.githubusercontent.com/" +

        /* =====================================================

        /* =====================================================
           DATA
        ===================================================== */

        let zones = [];

        let sortMode = "name";


        /* =====================================================
           LOAD ZONES.JSON
        ===================================================== */

        async function loadZones() {

            try {

                status.textContent =
                    "Loading GN-Math games...";


                const response =
                    await fetch(
                        ZONES_URL +
                        "?cache=" +
                        Date.now()
                    );


                if (!response.ok) {

                    throw new Error(
                        "zones.json returned HTTP " +
                        response.status
                    );
                }


                zones =
                    await response.json();


                if (!Array.isArray(zones)) {

                    throw new Error(
                        "zones.json is not an array."
                    );
                }


                console.log(
                    "GN-Math games loaded:",
                    zones.length
                );


                renderGames();


            } catch (err) {

                console.error(err);


                status.textContent =
                    "Failed to load GN-Math.";


                error.style.display =
                    "block";


                error.textContent =
                    "Could not load GN-Math's " +
                    "zones.json.\n\n" +
                    err.message;
            }
        }


        /* =====================================================
           GET COVER URL
        ===================================================== */

        function getCoverURL(zone) {

            if (!zone.cover) {

                return "";
            }


            return zone.cover
                .replace(
                    "{COVER_URL}",
                    COVERS_URL
                )
                .replace(
                    "{HTML_URL}",
                    HTML_URL
                );
        }


        /* =====================================================
           GET GAME URL
        ===================================================== */

        function getGameURL(zone) {

            if (!zone.url) {

                return null;
            }


            return zone.url
                .replace(
                    "{HTML_URL}",
                    HTML_URL
                )
                .replace(
                    "{COVER_URL}",
                    COVERS_URL
                );
        }


        /* =====================================================
           SORT GAMES
        ===================================================== */

        function sortGames(list) {

            list.sort(
                function(a, b) {

                    if (sortMode === "id") {

                        return (
                            Number(a.id || 0) -
                            Number(b.id || 0)
                        );
                    }


                    if (
                        sortMode ===
                        "popularity"
                    ) {

                        return (
                            Number(
                                b.popularity || 0
                            ) -
                            Number(
                                a.popularity || 0
                            )
                        );
                    }


                    return String(
                        a.name || ""
                    ).localeCompare(
                        String(
                            b.name || ""
                        )
                    );
                }
            );
        }


        /* =====================================================
           RENDER GAME LIST
        ===================================================== */

        function renderGames() {

            const searchText =
                search.value
                    .trim()
                    .toLowerCase();


            let filtered =
                zones.filter(
                    function(zone) {

                        const name =
                            String(
                                zone.name || ""
                            ).toLowerCase();


                        const id =
                            String(
                                zone.id || ""
                            ).toLowerCase();


                        const author =
                            String(
                                zone.author || ""
                            ).toLowerCase();


                        return (
                            name.includes(
                                searchText
                            ) ||

                            id.includes(
                                searchText
                            ) ||

                            author.includes(
                                searchText
                            )
                        );
                    }
                );


            sortGames(filtered);


            games.innerHTML = "";


            status.textContent =
                filtered.length +
                " games";


            if (
                filtered.length === 0
            ) {

                games.innerHTML =
                    "<div style='" +
                    "padding:20px;" +
                    "color:#888;" +
                    "'>" +
                    "No games found." +
                    "</div>";

                return;
            }


            for (
                const zone of filtered
            ) {

                createGameCard(zone);
            }
        }


        /* =====================================================
           CREATE GAME CARD
        ===================================================== */

        function createGameCard(zone) {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "game-card";


            const cover =
                document.createElement(
                    "img"
                );

            cover.className =

            cover.src =

            cover.alt =
                zone.name || "Game";


            cover.loading =
                "lazy";


            cover.onerror =
                function() {

                    cover.style.display =
                        "none";
                };


            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "game-info";


            const name =
                document.createElement(
                    "p"
                );

            name.className =
                "game-name";

            name.textContent =
                zone.name ||
                "Unnamed Game";


            const author =
                document.createElement(
                    "p"
                );

            author.className =
                "game-author";

            author.textContent =
                zone.author
                    ? "by " + zone.author
                    : "";


            const id =
                document.createElement(
                    "p"
                );

            id.className =
                "game-id";

            id.textContent =
                "ID: " +
                (
                    zone.id ??
                    "unknown"
                );


            info.appendChild(name);
            info.appendChild(author);
            info.appendChild(id);


            card.appendChild(cover);
            card.appendChild(info);


            card.addEventListener(
                "click",
                function() {

                    loadGame(zone);
                }
            );


            games.appendChild(card);
        }

async function injectGameHTML(
    html,
    gameURL
) {

    /*
     * Parse the downloaded HTML.
     */

    const parser =
        new DOMParser();

    const doc =
        parser.parseFromString(
            html,
            "text/html"
        );


    /*
     * Determine the base URL.
     */

    let baseURL =
        gameURL.substring(
            0,
            gameURL.lastIndexOf("/") + 1
        );


    const existingBase =
        doc.querySelector(
            "base[href]"
        );


    if (existingBase) {

        baseURL =
            new URL(
                existingBase.getAttribute(
                    "href"
                ),
                gameURL
            ).href;
    }


    /*
     * Remove original base tags.
     */

    doc
        .querySelectorAll("base")
        .forEach(
            base => base.remove()
        );


    /*
     * Copy styles.
     */

    const styles =
        doc.querySelectorAll(
            "link[rel='stylesheet'], style"
        );


    styles.forEach(
        style => {

            const clone =
                style.cloneNode(true);


            if (
                clone.tagName.toLowerCase()
                === "link"
            ) {

                rewriteURLAttribute(
                    clone,
                    "href",
                    baseURL
                );
            }


            gameContent.appendChild(
                clone
            );
        }
    );


    /*
     * Copy body elements.
     */

    const bodyElements =
        Array.from(
            doc.body.children
        );


    for (
        const element
        of bodyElements
    ) {

        /*
         * Don't execute scripts yet.
         */

        if (
            element.tagName
                .toLowerCase()
            === "script"
        ) {

            continue;
        }


        const clone =
            element.cloneNode(true);


        rewriteElementResources(
            clone,
            baseURL
        );


        gameContent.appendChild(
            clone
        );
    }


    /*
     * Get scripts in their original order.
     */

    const scripts =
        Array.from(
            doc.querySelectorAll(
                "script"
            )
        );


    /*
     * Execute them sequentially.
     */

    for (
        const script
        of scripts
    ) {

        await executeScript(
            script,
            baseURL
        );
    }


    /*
     * Remove loading screen.
     */

    const loading =
        document.getElementById(
            "game-loading"
        );


    if (loading) {

        loading.remove();
    }
}

        /* =====================================================
           RESOLVE URL
        ===================================================== */

        function resolveURL(
            value,
            baseURL
        ) {

            if (!value) {

                return value;
            }


            value =
                value.trim();


            /*
                Ignore special URLs.
            */

            if (
                value.startsWith(
                    "data:"
                ) ||

                value.startsWith(
                    "blob:"
                ) ||

                value.startsWith(
                    "javascript:"
                ) ||

                value.startsWith(
                    "#"
                )
            ) {

                return value;
            }


            try {

                return new URL(
                    value,
                    baseURL
                ).href;

            } catch {

                return value;
            }
        }


        /* =====================================================
           REWRITE ELEMENT URL
        ===================================================== */

        function rewriteURLAttribute(
            element,
            attribute,
            baseURL
        ) {

            const value =
                element.getAttribute(
                    attribute
                );


            if (!value) {

                return;
            }


            element.setAttribute(
                attribute,
                resolveURL(
                    value,
                    baseURL
                )
            );
        }


        /* =====================================================
           INJECT GAME
        ===================================================== */

        async function injectGame(
            gameURL
        ) {

            /*
                Download the actual game HTML.
            */

            const response =
                await fetch(
                    gameURL
                );


            if (!response.ok) {

                throw new Error(
                    "Game returned HTTP " +
                    response.status
                );
            }


            const html =
                await response.text();


            /*
                Parse the HTML without putting
                it into the document yet.
            */

            const parser =
                new DOMParser();


            const doc =
                parser.parseFromString(
                    html,
                    "text/html"
                );


            /*
                Determine the game's resource base.

                GN-Math games can contain their own
                <base href="...">.

                For example, some games point at
                another CDN for their actual assets.
            */

            let baseURL =
                gameURL.substring(
                    0,
                    gameURL.lastIndexOf(
                        "/"
                    ) + 1
                );


            const existingBase =
                doc.querySelector(
                    "base[href]"
                );


            if (existingBase) {

                baseURL =
                    resolveURL(
                        existingBase.getAttribute(
                            "href"
                        ),
                        gameURL
                    );
            }


            /*
                Remove the original <base>.

                We do NOT want it changing the
                base URL of the CodeHS page.
            */

            doc
                .querySelectorAll(
                    "base"
                )
                .forEach(
                    function(base) {

                        base.remove();
                    }
                );


            /* =================================================
               COPY STYLES
            ================================================== */

            const styles =
                doc.querySelectorAll(
                    "link[rel='stylesheet'], style"
                );


            for (
                const style of styles
            ) {

                if (
                    style.tagName
                        .toLowerCase() ===
                    "link"
                ) {

                    rewriteURLAttribute(
                        style,
                        "href",
                        baseURL
                    );

                } else {

                    /*
                        Inline CSS stays inline.
                    */
                }


                gameContent.appendChild(
                    style.cloneNode(true)
                );
            }


            /* =================================================
               COPY BODY
            ================================================== */

            const bodyChildren =
                Array.from(
                    doc.body.children
                );


            for (
                const element
                of bodyChildren
            ) {

                /*
                    Don't copy script tags yet.

                    We need to recreate them
                    manually so browsers execute them.
                */

                if (
                    element.tagName
                        .toLowerCase() ===
                    "script"
                ) {

                    continue;
                }


                const clone =
                    element.cloneNode(
                        true
                    );


                /*
                    Rewrite common resource URLs.
                */

                rewriteElementResources(
                    clone,
                    baseURL
                );


                gameContent.appendChild(
                    clone
                );
            }


            /* =================================================
               LOAD SCRIPTS
            ================================================== */

            const scripts =
                Array.from(
                    doc.querySelectorAll(
                        "script"
                    )
                );


            /*
                We execute scripts in the same
                order as the original HTML.
            */

            for (
                const oldScript
                of scripts
            ) {

                await executeScript(
                    oldScript,
                    baseURL
                );
            }


            /*
                Hide loading overlay.
            */

            const loading =
                document.getElementById(
                    "game-loading"
                );


            if (loading) {

                loading.remove();
            }
        }


        /* =====================================================
           REWRITE RESOURCES
        ===================================================== */

        function rewriteElementResources(
            root,
            baseURL
        ) {

            /*
                The root itself may have a
                resource attribute.
            */

            const tags = [
                "img",
                "audio",
                "video",
                "source",
                "track",
                "input",
                "object",
                "embed"
            ];


            for (
                const tag of tags
            ) {

                root
                    .querySelectorAll(
                        tag
                    )
                    .forEach(
                        function(element) {

                            rewriteURLAttribute(
                                element,
                                "src",
                                baseURL
                            );


                            rewriteURLAttribute(
                                element,
                                "poster",
                                baseURL
                            );


                            rewriteURLAttribute(
                                element,
                                "data",
                                baseURL
                            );
                        }
                    );
            }


            /*
                Links.
            */

            root
                .querySelectorAll(
                    "a[href]"
                )
                .forEach(
                    function(element) {

                        rewriteURLAttribute(
                            element,
                            "href",
                            baseURL
                        );
                    }
                );


            /*
                Inline styles containing url(...)
                need their URLs rewritten too.

                This is basic handling; external CSS
                files keep their own resource base.
            */

            root
                .querySelectorAll(
                    "[style]"
                )
                .forEach(
                    function(element) {

                        const style =
                            element.getAttribute(
                                "style"
                            );


                        if (
                            style &&
                            style.includes(
                                "url("
                            )
                        ) {

                            const rewritten =
                                style.replace(
                                    /url\(\s*(['"]?)(.*?)\1\s*\)/gi,
                                    function(
                                        match,
                                        quote,
                                        url
                                    ) {

                                        return (
                                            "url(" +
                                            quote +
                                            resolveURL(
                                                url,
                                                baseURL
                                            ) +
                                            quote +
                                            ")"
                                        );
                                    }
                                );


                            element.setAttribute(
                                "style",
                                rewritten
                            );
                        }
                    }
                );
        }


        /* =====================================================
           EXECUTE SCRIPT
        ===================================================== */

        function executeScript(
            oldScript,
            baseURL
        ) {

            return new Promise(
                function(
                    resolve,
                    reject
                ) {

                    const script =
                        document.createElement(
                            "script"
                        );


                    /*
                        Copy attributes.
                    */

                    for (
                        const attribute
                        of oldScript.attributes
                    ) {

                        if (
                            attribute.name ===
                            "src"
                        ) {

                            continue;
                        }


                        script.setAttribute(
                            attribute.name,
                            attribute.value
                        );
                    }


                    /*
                        External script.
                    */

                    if (
                        oldScript.src
                    ) {

                        script.src =
                            resolveURL(
                                oldScript.getAttribute(
                                    "src"
                                ),
                                baseURL
                            );


                        script.onload =
                            function() {

                                resolve();
                            };


                        script.onerror =
                            function() {

                                reject(
                                    new Error(
                                        "Failed to load script: " +
                                        script.src
                                    )
                                );
                            };


                        gameContent.appendChild(
                            script
                        );


                        return;
                    }


                    /*
                        Inline script.
                    */

                    script.textContent =
                        oldScript.textContent;


                    gameContent.appendChild(
                        script
                    );


                    resolve();
                }
            );
        }


        /* =====================================================
           GAME ERROR
        ===================================================== */

        function showGameError(
            err
        ) {

            gameContent.innerHTML = "";


            const message =
                document.createElement(
                    "div"
                );


            message.id =
                "game-error";


            message.style.display =
                "block";


            message.textContent =
                "Unable to load this game.\n\n" +
                err.message +
                "\n\n" +
                "This particular game may " +
                "require an external resource " +
                "that CodeHS blocks.";


            gameContent.appendChild(
                message
            );
        }

        backButton.addEventListener(
